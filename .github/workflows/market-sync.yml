name: Market Sync

on:
  workflow_dispatch:

concurrency:
  group: market-sync
  cancel-in-progress: false

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Server Endpoint
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X GET "https://op-rebote.vercel.app/api/cron/nightly-scan" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "HTTP $STATUS"
          [ "$STATUS" = "200" ] || { echo "Error en el escaneo"; exit 1; }