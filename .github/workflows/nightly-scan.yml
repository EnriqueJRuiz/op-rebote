name: Trade Republic Market Sync (15 min)

on:
  schedule:
    # Se ejecuta cada 15 minutos desde las 7:00 hasta las 23:00 de lunes a viernes
    - cron: '0,15,30,45 7-23 * * 1-5'
  workflow_dispatch: # Permite probarlo manualmente desde la pestaña "Actions" de GitHub

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Server Endpoint
        run: |
          echo "🚀 Lanzando escaneo de Trade Republic..."

          STATUS=$(curl -sS -o response.txt -w "%{http_code}" \
            -X GET "https://op-rebote.vercel.app/api/cron/nightly-scan" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "📡 HTTP $STATUS"
          cat response.txt
          echo

          # Falla el job si el endpoint no responde 200 (así un error no parece éxito)
          [ "$STATUS" = "200" ] || exit 1