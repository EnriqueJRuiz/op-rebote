name: Trade Republic Market Sync (15 min)

on:
  schedule:
    # Se ejecuta cada 15 minutos desde las 7:00 hasta las 23:00 de lunes a viernes
    - cron: '0,15,30,45 7-23 * * 1-5'
  workflow_dispatch: # Permite probarlo manualmente haciendo clic en la pestaña "Actions" de GitHub

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Server Endpoint
        run: |
          echo "🚀 Lanzando escaneo de Trade Republic..."

          RESPONSE=$(curl -sS -L -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "https://op-rebote.vercel.app/api/cron/nightly-scan" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS_SECRET }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "📡 Respuesta de Vercel:"
          echo "$RESPONSE"