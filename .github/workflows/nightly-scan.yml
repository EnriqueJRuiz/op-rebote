name: Trade Republic Market Sync

on:
  schedule:
    # Cada 30 min, 7:30-23:00 hora de España en verano e invierno (UTC)
    - cron: '30 5 * * 1-5'
    - cron: '0,30 6-21 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: market-sync
  cancel-in-progress: false

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Server Endpoint
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X GET "https://op-rebote.vercel.app/api/cron/nightly-scan" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "HTTP $STATUS"
          [ "$STATUS" = "200" ] || { echo "Error en el escaneo"; exit 1; }