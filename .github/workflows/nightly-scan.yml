name: Nightly Market Scan & Sync

on:
  schedule:
    # Se ejecuta todos los días a las 23:00 UTC (ajusta si lo prefieres en otra hora)
    - cron: '0 23 * * *'
  workflow_dispatch: # Permite probarlo manualmente haciendo clic en la pestaña "Actions" de GitHub

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Server Endpoint
        run: |
          echo "🚀 Lanzando nightly scan..."

          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "https://op-rebote.vercel.app/api/cron/nightly-scan" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS_SECRET }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "📡 Respuesta de Vercel:"
          echo "$RESPONSE"